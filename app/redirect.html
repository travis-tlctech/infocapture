<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Signing in to InfoCapture</title>
  <style>
    body { font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f3f5f7; color: #0f1b24; }
    @media (prefers-color-scheme: dark) { body { background: #0d1416; color: #e7eef0; } }
  </style>
</head>
<body>
  <p>Finishing Microsoft sign-in...</p>
  <!-- MSAL v5 redirect bridge: hands the sign-in response back to the app.
       Registered as the SPA redirect URI in the Entra app registration. -->
  <script type="module">
    import { broadcastResponseToMainFrame } from './vendor/msal-redirect-bridge.min.js';
    broadcastResponseToMainFrame().catch((err) => {
      console.error('Sign-in response could not be processed', err);
      location.replace('./');
    });
  </script>
</body>
</html>
