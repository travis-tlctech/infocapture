name: Deploy card reader

# Run by hand (Actions > Deploy card reader > Run workflow). Signs in to AWS
# as the infocapture-github-deploy role that backend/card-reader/bootstrap.sh
# created; no AWS keys are stored in GitHub.
on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: TLC Tech AWS account number (bootstrap.sh prints it)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: card-reader-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: card-reader
    steps:
      - name: Check the account number
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
        run: '[[ "$ACCOUNT" =~ ^[0-9]{12}$ ]] || { echo "The AWS account number is 12 digits."; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What AWS checks against the deploy role's trust policy (the claims
      # only; the token itself is never printed).
      - name: Show the GitHub identity AWS will check
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys, json, base64; t = json.load(sys.stdin)['value'].split('.')[1]; c = json.loads(base64.urlsafe_b64decode(t + '=' * (-len(t) % 4))); print(json.dumps({k: c.get(k) for k in ('sub', 'aud', 'iss', 'repository', 'environment', 'ref')}, indent=1))"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/infocapture-github-deploy
          aws-region: us-east-2
      - name: Test, build and deploy
        run: ./backend/card-reader/deploy.sh
        env:
          AWS_CREDENTIALS_FROM_ENV: '1'
