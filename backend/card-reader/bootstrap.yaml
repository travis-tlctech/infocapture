AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Lets GitHub Actions in the InfoCapture repository deploy the card reader
  stack without long-lived AWS keys: a bucket for code packages, and a role
  that only the repository's "card-reader" GitHub environment can assume,
  limited to the card reader stack and its own resources. Run bootstrap.sh.

Parameters:
  GitHubRepo:
    Type: String
    # As GitHub writes it in the sign-in token's subject, which for this
    # repository includes the owner's and the repository's fixed ID numbers
    # (the deploy workflow prints the subject). The IDs never change, so a
    # deleted and re-created repository with the same name cannot match.
    Default: travis-tlctech@327117175/infocapture@1426302484
    AllowedPattern: '[A-Za-z0-9_.-]+(@[0-9]+)?/[A-Za-z0-9_.-]+(@[0-9]+)?'
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: The account's token.actions.githubusercontent.com identity provider, if it already has one (bootstrap.sh looks it up)
  CardReaderStack:
    Type: String
    Default: infocapture-card-reader
  ApiKeySecretName:
    Type: String
    Default: infocapture/anthropic-api-key

Conditions:
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, '']

Resources:
  # GitHub's sign-in for AWS. An account has at most one; another project
  # may already have added it, in which case it is reused.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub infocapture-deploy-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-code-packages
            Status: Enabled
            ExpirationInDays: 90

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: infocapture-github-deploy
      Description: GitHub Actions in the InfoCapture repo deploy the card reader with this role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:card-reader
      Policies:
        - PolicyName: deploy-card-reader
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CardReaderStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:DeleteStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${CardReaderStack}/*
              - Sid: ReadTemplates
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: '*'
              - Sid: CodePackages
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Sid: CodePackageBucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: CardReaderFunction
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${CardReaderStack}-*
              - Sid: CardReaderFunctionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${CardReaderStack}-*
              # The function's role may only get the basic Lambda logging policy
              # attached, and may only be handed to Lambda.
              - Sid: BasicLambdaPolicyOnly
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${CardReaderStack}-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassRoleToLambdaOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${CardReaderStack}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: CardReaderLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CardReaderStack}-*
              - Sid: FindLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              # Metadata only (deploy.sh checks the key exists). Never the value.
              - Sid: ApiKeyExists
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApiKeySecretName}-??????

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ArtifactBucket:
    Value: !Ref ArtifactBucket
